# Checks every pull request into main and every push to main. The job is
# named "verify": that is the required status check on main (see
# docs/release-pipeline.md). It needs no secrets: checkout runs unconfigured,
# so the end-to-end tests cover its unavailable state and input guards.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    # Chromium and its system libraries come preinstalled in the Playwright
    # image, so CI never waits on apt mirrors. Keep the tag equal to the
    # @playwright/test version in package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_PORT: "3100"
      PLAYWRIGHT_IMAGE_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Check Playwright image matches the lockfile
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the CI image is v$PLAYWRIGHT_IMAGE_VERSION; update the container tag."
            exit 1
          fi

      # The media test needs ffprobe only. A pinned npm package (integrity-checked
      # by npm) avoids slow apt mirrors.
      - name: Install ffprobe (media tests)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ffprobe" ffprobe-static@3.1.0
          bin="$RUNNER_TEMP/ffprobe/node_modules/ffprobe-static/bin/linux/x64"
          chmod +x "$bin/ffprobe"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/ffprobe" -version | head -1

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Serves the build above on PLAYWRIGHT_PORT; no rebuild, no reused server.
      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
